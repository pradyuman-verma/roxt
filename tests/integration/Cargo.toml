[package]
name = "roxt-integration"
description = "End-to-end tests for roxt against fixture files; not published"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Test-only crate: the lib exists solely so cargo accepts the package; all
# substance lives under tests/.
path = "src/lib.rs"

[dev-dependencies]
roxt-core.workspace = true
roxt-ingest.workspace = true
roxt-store.workspace = true
roxt-query.workspace = true

assert_cmd = "2"
predicates = "3"
mcap.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
